<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages (mock page)</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #fff; color: #111; }
  nav { display: flex; gap: 14px; padding: 14px 16px; border-bottom: 1px solid #ddd; font-weight: 600; align-items: center; }
  nav a { color: #111; text-decoration: none; display: flex; align-items: center; gap: 6px; }
  .hidden-link { position: absolute; width: 1px; height: 1px; overflow: hidden; }
  main { padding-top: 6px; }
  .row { display: flex; gap: 12px; padding: 12px; align-items: flex-start; }
  .av { width: 48px; height: 48px; border-radius: 50%; background: #c9b; flex: none; }
  .card { position: relative; width: 200px; height: 340px; background: #333; border-radius: 12px; overflow: hidden; }
  .card video { width: 200px; height: 340px; display: block; background: #222; }
  .card .av { position: absolute; left: 8px; top: 8px; width: 32px; height: 32px; border: 2px solid #fff; }
  .card span { position: absolute; left: 46px; top: 16px; color: #fff; font-size: 13px; }
  .portrait { width: 200px; height: 340px; background: #456; border-radius: 12px; }
  .photo { width: 260px; height: 200px; background: #8ab; border-radius: 14px; display: block; }
  .bubble { max-width: 300px; }
  .thumb { width: 90px; height: 160px; background: #a86; border-radius: 10px; }
</style>
</head>
<body>
<nav>
  <strong>Messages</strong>
  <a href="/"><svg aria-label="Home" width="16" height="16"></svg>Home</a>
  <a href="/reels/"><svg aria-label="Reels" width="16" height="16"></svg>Reels</a>
  <a href="/explore/"><svg aria-label="Explore" width="16" height="16"></svg>Explore</a>

<main>
  <a class="hidden-link" href="/direct/t/1/">Friend One</a>

      <span>creator_name</span>
    </div>
  </div>
  <div class="row">
    <video id="friend-video" class="portrait" muted></video>
  </div>
  <div class="row">
    <img class="av" id="pfp-side" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">

  <div class="row">
    <img id="one-time" width="200" height="200" alt="View once photo" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='200'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23f2b97a'/><stop offset='1' stop-color='%236fa8c7'/></linearGradient></defs><rect width='260' height='200' fill='url(%23g)'/><circle cx='190' cy='58' r='22' fill='%23fff3d6' opacity='.9'/><path d='M0 160 L70 100 L130 150 L180 120 L260 170 L260 200 L0 200Z' fill='%23356b4f' opacity='.85'/></svg>">
  </div>
  <div class="row">
    <audio id="voice" controls></audio>
  </div>
  <div class="row" id="story-row">
    <img id="story-thumb" class="thumb" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
    <p>replied to your story</p>
  </div>
</main>

</html>
